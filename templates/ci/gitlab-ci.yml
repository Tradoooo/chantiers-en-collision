# GitLab CI — "Chantiers en collision" attested footprint (spec §10, CC-13).
# One job, capped at 5 minutes: post the files this branch changed since it diverged from the
# base branch (an ATTESTED footprint — a developer who installed nothing becomes visible too),
# then optionally report a real conflict. Fail-open: it never fails the pipeline.
# CI/CD variables: CHANTIER_URL = https://<INSTALLATION>.webtrigger.atlassian.app/v2/<APP_ID>/ingest
# (no trailing route), CHANTIER_PROJECT_TOKEN (project token, /ci/* routes only).
chantiers-footprint:
  stage: test
  image: alpine:3.20
  timeout: 5m
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0" # the three-dot diff needs the divergence point
    BASE: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    SLUG: $CI_PROJECT_PATH
    BRANCH: $CI_COMMIT_REF_NAME
  before_script:
    - apk add --no-cache git curl >/dev/null
    - BASE="${BASE:-$CI_DEFAULT_BRANCH}"
    - git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" || true
  script:
    - |
      ISSUE_KEY="$(printf '%s' "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)"
      CHANGED="$(git diff --name-only "origin/$BASE...HEAD")" || exit 0 # no merge base: skip
      FILES="$(printf '%s\n' "$CHANGED" | sed 's/\\/\\\\/g; s/"/\\"/g' | sed '/^$/d; s/.*/"&"/' | paste -sd, -)"
      curl -sS --max-time 30 -X POST "$CHANTIER_URL/ci/footprint" -H "Authorization: Bearer $CHANTIER_PROJECT_TOKEN" -H "Content-Type: application/json" -d "{\"repoSlug\":\"$SLUG\",\"branch\":\"$BRANCH\",\"baseBranch\":\"$BASE\",\"issueKey\":\"$ISSUE_KEY\",\"files\":[$FILES]}" || true
    # Optional second call: only sent when merging the base branch really conflicts.
    - |
      git merge --no-commit --no-ff "origin/$BASE" >/dev/null 2>&1 && { git merge --abort 2>/dev/null || true; exit 0; }
      ISSUE_KEY="$(printf '%s' "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)"
      PATHS="$(git diff --name-only --diff-filter=U | awk 'NR>1{printf "\\n"} {printf "%s",$0}' | sed 's/"/\\"/g')"
      curl -sS --max-time 30 -X POST "$CHANTIER_URL/ci/conflict" -H "Authorization: Bearer $CHANTIER_PROJECT_TOKEN" -H "Content-Type: application/json" -d "{\"issueKey\":\"$ISSUE_KEY\",\"repoSlug\":\"$SLUG\",\"paths\":\"$PATHS\"}" || true
      git merge --abort 2>/dev/null || true
