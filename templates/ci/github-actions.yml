# GitHub Actions — "Chantiers en collision" attested footprint (spec §10, CC-13).
# One job, two steps: post the files this branch changed since it diverged from the base branch
# (an ATTESTED footprint, visible even without any tooling), then optionally report a real
# conflict. Copy this file to .github/workflows/. Fail-open: it never blocks a build.
# Secrets: CHANTIER_URL = https://<INSTALLATION>.webtrigger.atlassian.app/v2/<APP_ID>/ingest
# (no trailing route), CHANTIER_PROJECT_TOKEN (project token, /ci/* routes only).
name: chantiers-footprint
on: [push, pull_request]
concurrency:
  group: chantiers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANTIER_URL: ${{ secrets.CHANTIER_URL }}
      CHANTIER_PROJECT_TOKEN: ${{ secrets.CHANTIER_PROJECT_TOKEN }}
      SLUG: ${{ github.repository }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the three-dot diff needs the divergence point
      - name: Attested footprint - files changed since the base branch
        run: |
          ISSUE_KEY="$(printf '%s' "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)"
          CHANGED="$(git diff --name-only "origin/$BASE...HEAD")" || exit 0 # no merge base: skip
          FILES="$(printf '%s\n' "$CHANGED" | sed 's/\\/\\\\/g; s/"/\\"/g' | sed '/^$/d; s/.*/"&"/' | paste -sd, -)"
          curl -sS --max-time 30 -X POST "$CHANTIER_URL/ci/footprint" -H "Authorization: Bearer $CHANTIER_PROJECT_TOKEN" -H "Content-Type: application/json" -d "{\"repoSlug\":\"$SLUG\",\"branch\":\"$BRANCH\",\"baseBranch\":\"$BASE\",\"issueKey\":\"$ISSUE_KEY\",\"files\":[$FILES]}" || true
      - name: Report a real merge conflict (optional, paths in conflict)
        if: always()
        run: |
          git merge --no-commit --no-ff "origin/$BASE" >/dev/null 2>&1 && { git merge --abort 2>/dev/null || true; exit 0; }
          ISSUE_KEY="$(printf '%s' "$BRANCH" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n1 || true)"
          PATHS="$(git diff --name-only --diff-filter=U | awk 'NR>1{printf "\\n"} {printf "%s",$0}' | sed 's/"/\\"/g')"
          curl -sS --max-time 30 -X POST "$CHANTIER_URL/ci/conflict" -H "Authorization: Bearer $CHANTIER_PROJECT_TOKEN" -H "Content-Type: application/json" -d "{\"issueKey\":\"$ISSUE_KEY\",\"repoSlug\":\"$SLUG\",\"paths\":\"$PATHS\"}" || true
          git merge --abort 2>/dev/null || true
