# File de merge Mergify — socle CI self-hosted (R630).
#
# La CI réelle du dépôt existe (workflow `ci`, jobs quality/test/manifest,
# tous ≤ 5 min sur runners self-hosted) : ses trois checks rejoignent
# queue_conditions aux côtés du garde `ci-budget` du socle.
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI réelle du dépôt (lint + typecheck, tests vitest, manifest, démo Pages).
      - check-success = quality
      - check-success = test
      - check-success = manifest
      - check-success = site
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "10 seconds"
    max_checks_retries: 1
    checks_timeout: 5 min
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # N workers self-hosted (R630, labels chantiers-en-collision-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
