# smoke-e2e — end-to-end smoke of a DEPLOYED Forge site's `ingest` web trigger.
#
# NEVER runs on PR: manual dispatch only, after the first `forge deploy`
# (see docs/DEPLOY.md). Budget rule: timeout-minutes 5, concurrency (no cancel
# so two manual runs never clobber each other's worksite), shallow checkout
# with clean:false (self-hosted workspaces persist — same house style as ci.yml).

name: smoke-e2e

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Ingest base URL of the deployed app, e.g. https://<INSTALLATION>.webtrigger.atlassian.app/v2/<APP_ID> (with or without trailing /ingest)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.run_id }}

env:
  # Self-hosted runner services don't load the login shell PATH.
  PATH: /home/baptiste/tools/node-v22.12.0-linux-x64/bin:/home/baptiste/.local/bin:/usr/local/bin:/usr/bin:/bin

jobs:
  smoke:
    name: smoke
    runs-on: [self-hosted, chantiers-en-collision-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false
      - name: Smoke (skipped when secrets are absent)
        env:
          # CHANTIER_URL below is normalized from the site_url input; the script
          # appends /ingest only if it is not already there.
          CHANTIER_URL: ${{ inputs.site_url }}
          CHANTIER_TOKEN: ${{ secrets.CHANTIER_SMOKE_TOKEN }}
          CHANTIER_PERSONAL_TOKEN: ${{ secrets.CHANTIER_SMOKE_PERSONAL_TOKEN }}
          CHANTIER_REPO: ${{ vars.CHANTIER_SMOKE_REPO || 'acme/smoke' }}
        run: |
          if [ -z "$CHANTIER_TOKEN" ]; then
            echo "secrets absents — smoke ignorée (à configurer après le premier forge deploy, voir docs/DEPLOY.md)"
            exit 0
          fi
          BASE="${CHANTIER_URL%/}"
          case "$BASE" in
            */ingest) ;;
            *) BASE="$BASE/ingest" ;;
          esac
          export CHANTIER_URL="$BASE"
          bash scripts/smoke-e2e.sh