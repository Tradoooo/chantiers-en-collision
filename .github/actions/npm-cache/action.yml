name: npm deps (persistent self-hosted)

# CI budget rule (user 2026-10-24): verdict in ≤ 5 min, never lengthen a
# timeout. On self-hosted runners the workspace persists, so:
#  - checkout MUST use clean:false (default git clean wipes node_modules
#    and forces a cold npm ci on every run);
#  - npm ci runs only when package-lock.json actually changed (stamp file);
#  - no actions/cache upload/download of node_modules (hundreds of MB) —
#    ~/.npm is shared and persistent on this machine anyway.

runs:
  using: composite
  steps:
    - name: Install dependencies (only when the lockfile changed)
      shell: bash
      run: |
        set -euo pipefail
        STAMP=node_modules/.lock-stamp
        if [ -f "$STAMP" ] && cmp -s package-lock.json "$STAMP"; then
          echo "node_modules up to date — skipping npm ci"
        else
          timeout 200 npm ci --prefer-offline --no-audit --no-fund
          mkdir -p node_modules
          cp package-lock.json "$STAMP"
        fi
