name: npm cache + install

# Shared step: restore ~/.npm and node_modules from the lockfile hash,
# then `npm ci` (near-instant when the cache hits). CI budget rule:
# keep every job under 5 minutes.

runs:
  using: composite
  steps:
    - name: Cache npm
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ runner.os }}-
    - name: Install dependencies
      shell: bash
      run: npm ci --prefer-offline --no-audit --no-fund
